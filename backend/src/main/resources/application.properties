spring.application.name=ayush-ngo-api
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ayush_ngo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

app.frontend-url=${FRONTEND_URL:http://localhost:8085}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:8000,http://127.0.0.1:8000,http://localhost:5500,http://127.0.0.1:5500}
app.email.enabled=${SMTP_ENABLED:false}
app.email.from=${SMTP_FROM:no-reply@example.invalid}
app.google.enabled=${GOOGLE_ENABLED:false}
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.payment.enabled=${PAYMENTS_ENABLED:false}
app.legacy-account-import.directory=${DATA_DIR:${user.home}/.ayush-ngo-data}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
spring.web.resources.static-locations=file:./,classpath:/static/
