<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Verify email | Ayush NGO</title><link rel="stylesheet" href="css/style.css"></head>
<body class="account-page"><header class="account-header"><a class="brand-logo" href="index.html"><span class="brand-icon-wrapper">🌱</span><span class="brand-text-group"><span class="brand-name">Ayush NGO</span><span class="brand-tagline">EMPOWERING LIVES, RESTORING HOPE</span></span></a></header>
<main class="account-shell"><section class="account-card"><p class="account-eyebrow">ACCOUNT SECURITY</p><h1>Verify your email</h1><p class="account-intro">Use the secure link sent to your inbox. Verification links expire and can only be used once.</p><form id="verifyForm" class="account-form"><label for="verifyToken">Verification token</label><input id="verifyToken" type="text" autocomplete="one-time-code" required><button class="btn btn-primary account-submit" type="submit">Verify email</button><p id="verifyStatus" class="account-status" role="status" aria-live="polite"></p></form><label for="resendEmail">Email address</label><input id="resendEmail" type="email" maxlength="254" autocomplete="email"><button id="resendVerification" class="account-inline-button" type="button">Resend verification email</button><p id="resendStatus" class="account-status" role="status" aria-live="polite"></p></section></main>
<script src="js/deploy-config.js"></script><script src="js/api.js"></script><script src="js/auth-ui.js"></script></body></html>
