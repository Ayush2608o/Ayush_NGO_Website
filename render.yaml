services:
  - type: web
    name: ayush-ngo-node-api
    runtime: node
    plan: starter
    rootDir: backend-node
    buildCommand: npm ci
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://ayushngo.netlify.app
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SAME_SITE
        value: none
      - key: DB_PATH
        value: /var/data/ayush_ngo_db.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: ayush-ngo-data
      mountPath: /var/data
      sizeGB: 1
