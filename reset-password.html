<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Password reset | Ayush NGO</title><link rel="stylesheet" href="css/style.css"></head>
<body class="account-page"><header class="account-header"><a class="brand-logo" href="index.html"><span class="brand-icon-wrapper">🌱</span><span class="brand-text-group"><span class="brand-name">Ayush NGO</span><span class="brand-tagline">EMPOWERING LIVES, RESTORING HOPE</span></span></a></header>
<main class="account-shell"><section class="account-card"><p class="account-eyebrow">ACCOUNT SECURITY</p><h1>Reset your password</h1><form id="forgotForm" class="account-form"><label for="forgotEmail">Email address</label><input id="forgotEmail" type="email" autocomplete="email" maxlength="254" required><button class="btn btn-primary account-submit" type="submit">Send reset link</button><p id="forgotStatus" class="account-status" role="status" aria-live="polite"></p></form><div class="account-divider"><span>Reset with a link</span></div><form id="resetForm" class="account-form"><label for="resetToken">Reset token</label><input id="resetToken" type="text" required><label for="resetPassword">New password</label><div class="password-field"><input id="resetPassword" type="password" minlength="12" maxlength="72" autocomplete="new-password" required><button type="button" class="password-toggle" data-password-toggle="resetPassword">Show</button></div><label for="resetConfirm">Confirm new password</label><input id="resetConfirm" type="password" minlength="12" maxlength="72" autocomplete="new-password" required><button class="btn btn-primary account-submit" type="submit">Update password</button><p id="resetStatus" class="account-status" role="status" aria-live="polite"></p></form><p class="account-switch"><a href="login.html">Return to sign in</a></p></section></main>
<script src="js/deploy-config.js"></script><script src="js/api.js"></script><script src="js/auth-ui.js"></script></body></html>
