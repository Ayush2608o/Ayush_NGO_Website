<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donate | Ayush NGO</title><link rel="stylesheet" href="css/style.css"><meta name="robots" content="noindex,nofollow"></head><body class="account-page"><main class="account-shell"><a href="index.html">â† Ayush NGO</a><section class="account-card"><p class="account-eyebrow">MANUAL UPI DONATION</p><h1>Donate</h1><p class="account-intro">Scan the administrator-provided QR code in your UPI app, complete the transfer, then submit the transaction reference for manual review. A screenshot or reference does not confirm payment.</p><div id="paymentInfo" class="account-status">Loading current payment detailsâ€¦</div><img id="upiQr" alt="Administrator configured UPI QR code" hidden style="max-width:280px;width:100%;margin:20px auto"><form id="donationForm"><label class="form-label" for="amount">AMOUNT (INR)</label><input class="form-control" id="amount" name="amount" type="number" min="1" max="10000000" step="0.01" required><label class="form-label" for="transactionReference">UPI / UTR REFERENCE</label><input class="form-control" id="transactionReference" name="transactionReference" minlength="6" maxlength="100" required><label class="form-label" for="screenshot">PAYMENT SCREENSHOT (OPTIONAL)</label><input class="form-control" id="screenshot" name="screenshot" type="file" accept="image/png,image/jpeg,image/webp"><button class="btn btn-primary" type="submit">Submit for verification</button></form><p id="donationStatus" role="status" aria-live="polite"></p></section></main><script src="js/deploy-config.js"></script><script src="js/api.js"></script><script>
const api=window.AyushAPI; const info=document.getElementById('paymentInfo'); const donationForm=document.getElementById('donationForm');
(async()=>{const settings=await api.get('/payment-settings');const s=settings.settings;if(!settings.success||!s||(!s.qr_image_path&&!s.upi_id)){info.textContent=settings.message||'UPI payment details could not be loaded.';return}if(s.qr_image_path){const im=document.getElementById('upiQr');im.onerror=()=>{info.textContent='Payment details loaded, but the QR image could not be displayed. Please contact us.'};im.hidden=false;im.src=`${api.baseUrl().replace(/\/api$/,'')}${s.qr_image_path}`}info.textContent=[s.account_holder_name,s.upi_id,s.instructions].filter(Boolean).join(' · ')||'Use the QR code to pay.';const user=await api.get('/auth/me');if(user.status===401){const note=document.createElement('span');note.append(' Sign in to submit your donation: ');const link=document.createElement('a');link.href='login.html';link.textContent='Sign in';note.append(link);info.append(note);donationForm.querySelector('button[type="submit"]').disabled=true}})().catch(error=>{console.error('Payment details could not be displayed.',error);info.textContent='Payment details could not be loaded. Please refresh and try again.'});
document.getElementById('donationForm').addEventListener('submit',async e=>{e.preventDefault();const status=document.getElementById('donationStatus');const button=e.currentTarget.querySelector('button');button.disabled=true;const result=await api.postForm('/donations',new FormData(e.currentTarget));status.textContent=result.message||'Submission failed.';status.dataset.state=result.success?'success':'error';button.disabled=false;if(result.success)e.currentTarget.reset()});
</script></body></html>
